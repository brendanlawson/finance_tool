org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler tries to compute a relative path between the
# pub cache (fixed under %LOCALAPPDATA%, typically the C: drive) and this
# project's own drive. On Windows, a relative path across two different
# drive letters is undefined and Kotlin's RelocatableFileToPathConverter
# throws IllegalArgumentException ("this and base files have different
# roots"), which surfaces as a build failure while closing incremental
# caches. Disabling incremental compilation avoids the code path entirely.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
